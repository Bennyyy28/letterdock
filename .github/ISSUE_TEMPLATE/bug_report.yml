name: Bug report
description: Report unexpected behavior using synthetic examples.
body:
  - type: markdown
    attributes:
      value: "Do not post private mail, real addresses/IDs, keys, cookies, or verification links. Report security issues privately using SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce with synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Letterdock version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, Node version, and hosting type
  - type: textarea
    id: evidence
    attributes:
      label: Safe reproduction or screenshot
      description: Redact all personal data and secrets first. Synthetic fixtures are preferred.
