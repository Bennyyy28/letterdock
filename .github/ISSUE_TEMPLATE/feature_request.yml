name: Feature request
description: Suggest an improvement to Letterdock.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives, accessibility considerations, or security implications if relevant.
    validations:
      required: true
